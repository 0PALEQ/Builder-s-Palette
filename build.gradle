buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
    configurations.classpath {
        resolutionStrategy {
            force 'com.google.code.gson:gson:2.13.2'
            eachDependency { details ->
                if (details.requested.group == 'com.google.code.gson' && details.requested.name == 'gson') {
                    details.useVersion '2.13.2'
                    details.because 'Loom record metadata parsing fails with Gson 2.9.1 on Java 21'
                }
            }
        }
    }
    dependencies {
        classpath 'com.google.code.gson:gson:2.13.2'
        classpath("net.fabricmc:fabric-loom:${loom_version}") {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'fabric-loom'

loom {
    getCustomMinecraftMetadata().set('https://piston-meta.mojang.com/v1/packages/5a8955165f24d35c04b5f3941e29d9365259c51a/1.20.1.json')
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('CookiecraftMods Licence v1.0.pdf'))
}
